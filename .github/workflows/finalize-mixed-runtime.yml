name: Finalize mixed provider runtime

on:
  push:
    branches:
      - agent/mixed-provider-runtime

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - name: Verify implementation is present
        run: |
          test -f src/model-profile.ts
          grep -q "curatedModels" src/provider-templates.ts
          grep -q "reasoningEffortMap" src/provider-factory.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Publish clean branch and open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -f .github/workflows/export-source.yml
          rm -f .github/workflows/implement-mixed-runtime.yml
          rm -f .github/workflows/finalize-mixed-runtime.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --soft origin/main
          git add -A
          git diff --cached --check
          git commit -m "feat: support curated mixed-protocol providers"
          git push --force-with-lease origin HEAD:agent/mixed-provider-runtime
          if ! gh pr view agent/mixed-provider-runtime --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            cat > /tmp/pr-body.md <<'EOF'
          ## Summary

          - add provider-neutral curated per-model metadata for mixed Anthropic and OpenAI-compatible providers
          - preserve per-model endpoints, costs, modalities, reasoning maps, and compatibility profiles through the registry and both bridge modes
          - allow explicitly configured Anthropic-format favorites in selective proxy mode
          - add focused regression coverage for curated overlays, metadata propagation, effort mapping, and Anthropic routing

          ## Why

          Mixed-protocol providers cannot be represented safely by one provider-level SDK package or endpoint. This establishes a reusable infrastructure layer so each model can declare its actual wire protocol and compatibility behavior without vendor-name heuristics.

          ## Validation

          - `pnpm typecheck`
          - `pnpm test`
          - `pnpm build`

          ## Stack

          This is PR 1 of 2. The OpenCode Go provider integration is stacked on this infrastructure PR.
          EOF
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head agent/mixed-provider-runtime --title "feat: support curated mixed-protocol providers" --body-file /tmp/pr-body.md
          fi
