name: Finalize OpenCode Go provider

on:
  push:
    branches:
      - agent/opencode-go-provider

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - name: Verify stack contents
        run: |
          test -f src/data/opencode-go-models.json
          test -f src/data/opencode-go-models.ts
          test -f scripts/update-opencode-go-models.mjs
          test "$(node -e "const m=require('./src/data/opencode-go-models.json'); process.stdout.write(String(m.length))")" = "17"
          ! grep -q '"id": "grok-4.5"' src/data/opencode-go-models.json
          grep -q "id: 'opencode-go'" src/provider-templates.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Publish clean stacked branch and ensure draft PR exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -f .github/workflows/implement-opencode-go.yml
          rm -f .github/workflows/finalize-opencode-go.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --soft origin/agent/mixed-provider-runtime
          git add -A
          git diff --cached --check
          git commit -m "feat: add OpenCode Go provider"
          git push --force-with-lease origin HEAD:agent/opencode-go-provider
          if ! gh pr view agent/opencode-go-provider --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            cat > /tmp/pr-body.md <<'EOF'
          ## Summary

          - add OpenCode Go as a first-class API-key provider
          - reconcile its sparse live `/models` response with a curated 17-model catalog
          - route four models through Anthropic Messages and thirteen through OpenAI Chat Completions
          - deliberately exclude Responses-only models, including Grok 4.5
          - preserve model-specific context windows, pricing, image support, reasoning maps, and compatibility metadata
          - add a maintenance generator, setup documentation, and mixed-protocol integration tests

          ## Validation

          - `pnpm typecheck`
          - `pnpm test`
          - `pnpm build`

          ## Stack

          PR 2 of 2. This targets `agent/mixed-provider-runtime` and should merge after the infrastructure PR.
          EOF
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --base agent/mixed-provider-runtime --head agent/opencode-go-provider --title "feat: add OpenCode Go provider" --body-file /tmp/pr-body.md
          fi
