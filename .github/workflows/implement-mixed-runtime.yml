function materializeTemplateModel(
  model: ProviderTemplateModel,
  template: ProviderTemplate,
): CachedModel {
  const npm = model.npm ?? template.npm;
  const id = model.id;
  const family = model.family ?? (id.split(/[-/:]/)[0] ?? id);
  return {
    id,
    name: model.name || id,
    upstreamModelId: model.upstreamModelId ?? id,
    family,
    brand: model.brand ?? deriveBrand(family),
    contextWindow: model.contextWindow ?? resolveContextWindow(id),
    cost: model.cost,
    modelFormat: model.modelFormat ?? modelFormatForNpm(npm),
    npm,
    apiUrl: model.apiUrl,
    supportedParameters: model.supportedParameters,
    reasoning: model.reasoning,
    interleavedReasoningField: model.interleavedReasoningField,
    modalities: model.modalities,
    reasoningEffortMap: model.reasoningEffortMap,
    compat: model.compat,
    useResponsesLite: model.useResponsesLite,
    preferWebSockets: model.preferWebSockets,
  };
}

/** Merge provider-maintained model metadata over a sparse live model list. */
export function applyCuratedModels(
  discovered: CachedModel[],
  template: ProviderTemplate,
): CachedModel[] {
  if (!template.curatedModels?.length) return discovered;
  const curated = new Map(
    template.curatedModels.map(model => [model.id, materializeTemplateModel(model, template)]),
  );
  const result: CachedModel[] = [];
  for (const model of discovered) {
    const override = curated.get(model.id);
    if (!override) {
      if (!template.curatedOnly) result.push(model);
      continue;
    }
    result.push({
      ...model,
      ...override,
      id: model.id,
      upstreamModelId: override.upstreamModelId || model.upstreamModelId,
      cost: override.cost ?? model.cost,
    });
  }
  return result;
}

