          new_effort = '''export function effortProviderOptions(
  npm: string,
  effort?: string,
  modelId?: string,
  metadata?: ReasoningMetadata,
): Record<string, Record<string, unknown>> | undefined {
  if (!effort || metadata?.compat?.supportsReasoningEffort === false) return undefined;

  const effortMap = metadata?.reasoningEffortMap;
  const hasExplicitMapping = effortMap !== undefined
    && Object.prototype.hasOwnProperty.call(effortMap, effort);
  const explicitlyMapped = hasExplicitMapping ? effortMap![effort] : undefined;
  if (hasExplicitMapping && explicitlyMapped === null) return undefined;
  const effectiveEffort = explicitlyMapped ?? effort;

  if (isOpenRouterRoute(npm, metadata)) {
    const caps = openRouterReasoningCapabilities(metadata);
    if (caps.mode !== 'controllable') return undefined;
    const allowed = new Set(OPENROUTER_EFFORT_LEVELS);
    const mapped = allowed.has(effectiveEffort as typeof OPENROUTER_EFFORT_LEVELS[number])
      ? effectiveEffort
      : effectiveEffort === 'max'
        ? 'xhigh'
        : undefined;
    return mapped
      ? { openrouter: { reasoning: { effort: mapped, exclude: false } } }
      : undefined;
  }

  if (npm === '@ai-sdk/openai' || npm === '@ai-sdk/azure') {
    if (!modelId || !modelPrefersResponsesApi(modelId)) return undefined;
    const reasoningEffort = mapCodexEffortToOpenAI(effectiveEffort, modelId);
    if (!reasoningEffort) return undefined;
    return isReasoningSummaryUnsupportedModel(modelId)
      ? { openai: { reasoningEffort, reasoningSummary: null } }
      : { openai: { reasoningEffort } };
  }

  if (npm === '@ai-sdk/xai') {
    if (!modelId || !isXaiReasoningEffortModel(modelId)) return undefined;
    const reasoningEffort = mapCodexEffortToXai(effectiveEffort);
    return reasoningEffort ? { xai: { reasoningEffort } } : undefined;
  }

  if (npm === '@ai-sdk/anthropic' || npm === VERTEX_ANTHROPIC_NPM) {
    if (!modelId || !isClaudeReasoningModel(modelId)) return undefined;
    const mapped = mapCodexEffortToAnthropic(effectiveEffort);
    return mapped
      ? { anthropic: { thinking: { type: 'adaptive', effort: mapped } } }
      : undefined;
  }

  if (npm === '@ai-sdk/google') {
    const id = modelId ?? '';
    if (isGemini3Model(id)) {
      const thinkingLevel = mapCodexEffortToGeminiLevel(effectiveEffort);
      return thinkingLevel
        ? { google: { thinkingConfig: { thinkingLevel, includeThoughts: true } } }
        : undefined;
    }
    const thinkingBudget = mapCodexEffortToGeminiBudget(effectiveEffort);
    return thinkingBudget
      ? { google: { thinkingConfig: { thinkingBudget, includeThoughts: true } } }
      : undefined;
  }

  if (npm === '@ai-sdk/mistral') {
    if (!modelId || !isMistralReasoningModel(modelId)) return undefined;
    const reasoningEffort = effectiveEffort === 'off' || effectiveEffort === 'none' ? 'none' : 'high';
    return { mistral: { reasoningEffort } };
  }

  if (npm === '@ai-sdk/openai-compatible' || npm === '@ai-sdk/openai') {
    if (!modelId) return undefined;
    if (isDeepSeekReasoningModel(modelId)) {
      return deepSeekEffortProviderOptions(effectiveEffort);
    }
    if (isKimiReasoningModel(modelId)) {
      const reasoningEffort = mapCodexEffortToOpenAI(effectiveEffort);
      if (reasoningEffort) {
        const key = metadata?.providerId ? toCamelCase(metadata.providerId) : 'openaiCompatible';
        return { [key]: { reasoningEffort } };
      }
      return undefined;
    }
    if (isGlm52ReasoningModel(modelId)) {
      const reasoningEffort = mapCodexEffortToGlm52(effectiveEffort);
      if (reasoningEffort) {
        const key = metadata?.providerId ? toCamelCase(metadata.providerId) : 'openaiCompatible';
        return { [key]: { reasoningEffort } };
      }
      return undefined;
    }
    if (hasSupportedParameter(metadata, 'reasoning_effort')) {
      const reasoningEffort = mapCodexEffortToOpenAI(effectiveEffort);
      return reasoningEffort
        ? { openai: { reasoningEffort }, openaiCompatible: { reasoningEffort } }
        : undefined;
    }
    if (hasSupportedParameter(metadata, 'reasoning')) {
      const allowed = new Set(OPENROUTER_EFFORT_LEVELS);
      const mapped = allowed.has(effectiveEffort as typeof OPENROUTER_EFFORT_LEVELS[number])
        ? effectiveEffort
        : effectiveEffort === 'max' ? 'xhigh' : undefined;
      return mapped
        ? { openrouter: { reasoning: { effort: mapped, exclude: false } } }
        : undefined;
    }
    if (hasExplicitMapping && explicitlyMapped) {
      const key = metadata?.providerId ? toCamelCase(metadata.providerId) : 'openaiCompatible';
      return key === 'openaiCompatible'
        ? { openaiCompatible: { reasoningEffort: explicitlyMapped } }
        : {
            [key]: { reasoningEffort: explicitlyMapped },
            openaiCompatible: { reasoningEffort: explicitlyMapped },
          };
    }
    return undefined;
  }

  return undefined;
}

