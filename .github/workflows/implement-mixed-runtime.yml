import type { ProviderTemplate } from '../src/provider-templates.js';
import { applyCuratedModels } from '../src/registry/fetch-template-models.js';
import { cachedModelToLocal } from '../src/registry/materialize.js';
import type { CachedModel, RegistryProvider } from '../src/registry/types.js';

const template: ProviderTemplate = {
  id: 'mixed',
  name: 'Mixed Provider',
  authType: 'api',
  npm: '@ai-sdk/openai-compatible',
  defaultBaseUrl: 'https://mixed.example/v1',
  modelSource: 'api-list',
  supported: true,
  curatedOnly: true,
  curatedModels: [{
    id: 'qwen-mixed',
    name: 'Qwen Mixed',
    npm: '@ai-sdk/anthropic',
    apiUrl: 'https://mixed.example/anthropic',
    modelFormat: 'anthropic',
    contextWindow: 1_000_000,
    cost: { input: 1, output: 2 },
    reasoning: true,
    modalities: ['text', 'image'],
    reasoningEffortMap: { low: null, high: 'high' },
    compat: { thinkingFormat: 'qwen', supportsStore: false },
  }],
};

const discovered: CachedModel[] = [{
  id: 'qwen-mixed',
  name: 'qwen-mixed',
  upstreamModelId: 'qwen-mixed',
  family: 'qwen',
  brand: 'Qwen',
  contextWindow: 131_072,
  modelFormat: 'openai',
  npm: '@ai-sdk/openai-compatible',
}, {
  id: 'unknown-future-model',
  name: 'Unknown',
  upstreamModelId: 'unknown-future-model',
  family: 'unknown',
  brand: 'Unknown',
  modelFormat: 'openai',
  npm: '@ai-sdk/openai-compatible',
}];

describe('curated mixed-protocol provider metadata', () => {
  it('overlays per-model protocol data and filters uncurated live models', () => {
    const models = applyCuratedModels(discovered, template);
    expect(models).toHaveLength(1);
    expect(models[0]).toMatchObject({
      id: 'qwen-mixed',
      npm: '@ai-sdk/anthropic',
      apiUrl: 'https://mixed.example/anthropic',
      modelFormat: 'anthropic',
      contextWindow: 1_000_000,
      cost: { input: 1, output: 2 },
      modalities: ['text', 'image'],
      reasoningEffortMap: { low: null, high: 'high' },
      compat: { thinkingFormat: 'qwen', supportsStore: false },
    });
  });

  it('carries compatibility metadata from registry to proxy routes', () => {
    const cached = applyCuratedModels(discovered, template)[0]!;
    const provider: RegistryProvider = {
      id: 'mixed',
      templateId: 'mixed',
      name: 'Mixed Provider',
      enabled: true,
      authRef: 'keyring:provider:mixed',
      authType: 'api',
      api: { npm: template.npm, url: template.defaultBaseUrl },
      modelsCache: { fetchedAt: new Date(0).toISOString(), models: [cached] },
      addedAt: new Date(0).toISOString(),
    };
    const local = cachedModelToLocal(cached, provider);
    expect(local).toMatchObject({
      modelFormat: 'anthropic',
      baseUrl: 'https://mixed.example/anthropic',
      interleavedReasoningField: 'reasoning_content',
      reasoningEffortMap: { low: null, high: 'high' },
      compat: { thinkingFormat: 'qwen', supportsStore: false },
    });
    const route = localModelToRoute({
      id: 'mixed',
      name: 'Mixed Provider',
      apiKey: 'secret',
      models: [local!],
    }, local!);
    expect(route).toMatchObject({
      modelFormat: 'anthropic',
      upstreamUrl: 'https://mixed.example/anthropic',
      reasoningEffortMap: { low: null, high: 'high' },
      compat: { thinkingFormat: 'qwen', supportsStore: false },
    });
  });

  it('uses explicit effort maps to suppress and add patched-client levels', () => {
    const metadata = {
      reasoning: true,
      reasoningEffortMap: { xhigh: null, max: 'max' },
    };
    const caps = getPatchReasoningCapabilities(
      '@ai-sdk/openai-compatible',
      'glm-5.2',
      metadata,
    );
    expect(caps.levels).toEqual(['high', 'max']);
    expect(effortProviderOptions(
      '@ai-sdk/openai-compatible',
      'max',
      'glm-5.2',
      metadata,
    )).toEqual({ openaiCompatible: { reasoningEffort: 'max' } });
  });

  it('does not advertise controls when the backend disables reasoning effort', () => {
    const caps = getPatchReasoningCapabilities(
      '@ai-sdk/openai-compatible',
      'kimi-k2.6',
      { reasoning: true, compat: { supportsReasoningEffort: false } },
    );
    expect(caps.levels).toEqual([]);
    expect(caps.mode).toBe('internal-only');
  });
});
