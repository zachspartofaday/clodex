          new_patch = '''export function getPatchReasoningCapabilities(
  npm: string,
  modelId: string,
  metadata?: ReasoningMetadata,
): ReasoningCapabilities {
  if (
    metadata?.reasoning === false
    && !hasSupportedParameter(metadata, 'reasoning_effort')
    && !hasSupportedParameter(metadata, 'reasoning')
  ) {
    return EMPTY_REASONING;
  }

  if (metadata?.compat?.supportsReasoningEffort === false) {
    return metadata.reasoning
      ? { ...EMPTY_REASONING, mode: 'internal-only', source: 'provider-metadata', confidence: 'documented' }
      : EMPTY_REASONING;
  }

  const capabilities = getReasoningCapabilities(npm, modelId, metadata);
  const explicitLevels = Object.entries(metadata?.reasoningEffortMap ?? {})
    .filter(([, mapped]) => mapped !== null)
    .map(([level]) => level);
  const candidateLevels = [...new Set([...capabilities.levels, ...explicitLevels])];
  const seenProviderOptions = new Set<string>();

  return {
    ...capabilities,
    levels: candidateLevels.filter(level => {
      const providerOptions = effortProviderOptions(npm, level, modelId, metadata);
      if (!providerOptions) return false;
      const fingerprint = JSON.stringify(providerOptions);
      if (seenProviderOptions.has(fingerprint)) return false;
      seenProviderOptions.add(fingerprint);
      return true;
    }),
  };
}

