name: Verify OpenCode Go stack

on:
  push:
    branches:
      - agent/opencode-go-provider

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - name: Verify draft PR stack exists and is targeted correctly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(gh pr view agent/mixed-provider-runtime --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)" = main
          test "$(gh pr view agent/opencode-go-provider --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)" = agent/mixed-provider-runtime
          test "$(gh pr view agent/mixed-provider-runtime --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          test "$(gh pr view agent/opencode-go-provider --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
      - name: Verify provider catalog contract
        run: |
          test -f src/model-profile.ts
          test -f src/data/opencode-go-models.json
          test "$(node -e "const m=require('./src/data/opencode-go-models.json'); process.stdout.write(String(m.length))")" = "17"
          test "$(node -e "const m=require('./src/data/opencode-go-models.json'); process.stdout.write(String(m.filter(x=>x.modelFormat==='anthropic').length))")" = "4"
          test "$(node -e "const m=require('./src/data/opencode-go-models.json'); process.stdout.write(String(m.filter(x=>x.modelFormat==='openai').length))")" = "13"
          ! grep -q '"id": "grok-4.5"' src/data/opencode-go-models.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Restore clean provider commit and stamp verified tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -f .github/workflows/implement-opencode-go.yml
          rm -f .github/workflows/finalize-opencode-go.yml
          rm -f .github/workflows/restack-opencode-go.yml
          rm -f .github/workflows/verify-opencode-go-stack.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin agent/mixed-provider-runtime
          git reset --soft origin/agent/mixed-provider-runtime
          git add -A
          git diff --cached --check
          git commit -m "feat: add OpenCode Go provider"
          git push --force-with-lease origin HEAD:agent/opencode-go-provider
          git tag -f opencode-go-stack-verified HEAD
          git push --force origin refs/tags/opencode-go-stack-verified
