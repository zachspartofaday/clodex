name: Harden mixed provider runtime

on:
  push:
    branches:
      - agent/mixed-provider-runtime

permissions:
  contents: write
  pull-requests: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - name: Recover or refine implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          profile = Path('src/model-profile.ts')
          if not profile.exists():
              workflow = Path('.github/workflows/implement-mixed-runtime.yml')
              if not workflow.exists():
                  raise RuntimeError('implementation is absent and the recovery workflow source is unavailable')
              source = workflow.read_text()
              marker = "          python <<'PY'\n"
              start = source.index(marker) + len(marker)
              end = source.index("\n          PY\n", start)
              script = textwrap.dedent(source[start:end])
              script, count = re.subn(
                  r"\n# Existing curated cost data is authoritative[\s\S]*?(?=\n# Selective proxy can safely route)",
                  "\n",
                  script,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError('could not remove the broad pricing mutation from recovery script')
              exec(compile(script, '<recovered-mixed-runtime>', 'exec'), {})

          # Never change global pricing precedence for unrelated providers.
          pricing_path = Path('src/registry/pricing.ts')
          pricing = pricing_path.read_text()
          pricing = pricing.replace('    if (model.cost) return model;\n', '')
          pricing_path.write_text(pricing)

          # Preserve curated costs only at curated-template ingestion.
          add_path = Path('src/registry/add-template.ts')
          add = add_path.read_text()
          old = '''  const pricedModels = enrichModelsWithPricing(
    catalogModels,
    buildPricingIndex(pricingCache),
    platform,
  );
'''
          new = '''  const pricedModels = enrichModelsWithPricing(
    catalogModels,
    buildPricingIndex(pricingCache),
    platform,
  ).map((model, index) => {
    const source = catalogModels[index];
    return source?.cost ? { ...model, cost: source.cost } : model;
  });
'''
          if old in add:
              add = add.replace(old, new, 1)
          elif new not in add:
              raise RuntimeError('curated pricing insertion point not found')
          add_path.write_text(add)
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Publish corrected clean branch and ensure draft PR exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -f .github/workflows/export-source.yml
          rm -f .github/workflows/implement-mixed-runtime.yml
          rm -f .github/workflows/finalize-mixed-runtime.yml
          rm -f .github/workflows/rescue-mixed-runtime.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --soft origin/main
          git add -A
          git diff --cached --check
          git commit -m "feat: support curated mixed-protocol providers"
          git push --force-with-lease origin HEAD:agent/mixed-provider-runtime
          if ! gh pr view agent/mixed-provider-runtime --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            cat > /tmp/pr-body.md <<'EOF'
          ## Summary

          - add provider-neutral curated per-model metadata for mixed Anthropic and OpenAI-compatible providers
          - preserve per-model endpoints, costs, modalities, reasoning maps, and compatibility profiles through the registry and both bridge modes
          - allow explicitly configured Anthropic-format favorites in selective proxy mode
          - keep curated pricing precedence scoped to curated-template ingestion
          - add focused regression coverage for curated overlays, metadata propagation, effort mapping, and Anthropic routing

          ## Validation

          - `pnpm typecheck`
          - `pnpm test`
          - `pnpm build`

          ## Stack

          PR 1 of 2. The OpenCode Go provider PR is stacked on this branch.
          EOF
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head agent/mixed-provider-runtime --title "feat: support curated mixed-protocol providers" --body-file /tmp/pr-body.md
          fi
