          write('src/data/opencode-go-models.ts', '''// Generated from monotykamary/pi-opencode-go-provider models.json + patch.json.
// Source blobs used for this snapshot:
//   models.json 0cecde7d5fdab46373f959a0e6189ebbe5de338c
//   patch.json  98d40a093f559c35d9267f6ff1deecb7d14e5213
// Run `pnpm update:opencode-go-models` to refresh it.

import modelData from './opencode-go-models.json';
import type { ProviderTemplateModel } from '../provider-templates.js';

export const OPENCODE_GO_PROVIDER_ID = 'opencode-go';
export const OPENCODE_GO_COMPLETIONS_URL = 'https://opencode.ai/zen/go/v1';
export const OPENCODE_GO_ANTHROPIC_URL = 'https://opencode.ai/zen/go';

const MODELS = modelData as unknown as readonly ProviderTemplateModel[];

/** Return independent objects so callers cannot mutate the bundled catalog. */
export function buildOpenCodeGoModels(): ProviderTemplateModel[] {
  return MODELS.map(model => ({
    ...model,
    cost: model.cost ? { ...model.cost } : undefined,
    supportedParameters: model.supportedParameters ? [...model.supportedParameters] : undefined,
    modalities: model.modalities ? [...model.modalities] : undefined,
    reasoningEffortMap: model.reasoningEffortMap ? { ...model.reasoningEffortMap } : undefined,
    compat: model.compat ? { ...model.compat } : undefined,
  }));
}
''')

          write('scripts/update-opencode-go-models.mjs', '''#!/usr/bin/env node

// Refresh the curated OpenCode Go model snapshot from the MIT-licensed Pi
// provider. Only Anthropic Messages and OpenAI Chat Completions models are
// emitted; Responses-only entries are deliberately excluded from Clodex.

import { writeFile } from 'node:fs/promises';
import { resolve } from 'node:path';

const MODELS_URL = 'https://raw.githubusercontent.com/monotykamary/pi-opencode-go-provider/main/models.json';
const PATCH_URL = 'https://raw.githubusercontent.com/monotykamary/pi-opencode-go-provider/main/patch.json';
const OUTPUT = resolve('src/data/opencode-go-models.json');
const SUPPORTED = new Set(['anthropic-messages', 'openai-completions']);
const STANDARD_REASONING_EFFORT = new Set([
  'glm-5.1',
  'minimax-m2.7',
  'mimo-v2.5',
  'gpt-5.6-luna',
  'kimi-k2.7-code',
  'mimo-v2.5-pro',
  'qwen3.6-plus',
]);
const BRANDS = {
  qwen: 'Qwen',
  glm: 'Z.AI',
  deepseek: 'DeepSeek',
  minimax: 'MiniMax',
  kimi: 'Moonshot AI',
  hy: 'Hy',
  mimo: 'Xiaomi',
  gpt: 'OpenAI',
};

async function json(url) {
  const response = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
  return response.json();
}

function merge(model, patch) {
  if (!patch) return { ...model };
  const result = { ...model, ...patch };
  if (patch.cost) result.cost = { ...(model.cost ?? {}), ...patch.cost };
  if (patch.compat) result.compat = { ...(model.compat ?? {}), ...patch.compat };
  if (patch.thinkingLevelMap) {
    result.thinkingLevelMap = {
      ...(model.thinkingLevelMap ?? {}),
      ...patch.thinkingLevelMap,
    };
  }
  return result;
}

function transform(model) {
  const anthropic = model.api === 'anthropic-messages';
  const family = model.id.split(/[-/:]/)[0] || model.id;
  const output = {
    id: model.id,
    name: model.name || model.id,
    upstreamModelId: model.id,
    family,
    brand: BRANDS[family] || family,
    contextWindow: model.contextWindow,
    cost: {
      input: model.cost?.input ?? 0,
      output: model.cost?.output ?? 0,
      cache_read: model.cost?.cacheRead ?? 0,
      cache_write: model.cost?.cacheWrite ?? 0,
    },
    modelFormat: anthropic ? 'anthropic' : 'openai',
    npm: anthropic ? '@ai-sdk/anthropic' : '@ai-sdk/openai-compatible',
    apiUrl: anthropic ? 'https://opencode.ai/zen/go' : 'https://opencode.ai/zen/go/v1',
    reasoning: model.reasoning === true,
    modalities: model.input ?? ['text'],
  };
  if (STANDARD_REASONING_EFFORT.has(model.id)) {
    output.supportedParameters = ['reasoning_effort'];
  }
  if (model.thinkingLevelMap) output.reasoningEffortMap = model.thinkingLevelMap;
  if (model.compat) output.compat = model.compat;
  return output;
}

const [models, patches] = await Promise.all([json(MODELS_URL), json(PATCH_URL)]);
const output = models
  .map(model => merge(model, patches[model.id]))
  .filter(model => SUPPORTED.has(model.api))
  .map(transform);

if (output.some(model => model.id === 'grok-4.5')) {
  throw new Error('Responses-only model unexpectedly survived filtering');
}
await writeFile(OUTPUT, `${JSON.stringify(output, null, 2)}\n`);
console.log(`Wrote ${output.length} OpenCode Go models to ${OUTPUT}`);
''')

          # Register the provider template.
          path = 'src/provider-templates.ts'
          text = read(path)
          text = replace_once(
              text,
              "import type { ModelCompatibilityProfile, ReasoningEffortMap } from './model-profile.js';\n",
              "import type { ModelCompatibilityProfile, ReasoningEffortMap } from './model-profile.js';\nimport { buildOpenCodeGoModels } from './data/opencode-go-models.js';\n",
              path + ' catalog import',
          )
          text = text.replace(
              '/** clodex ships exactly two provider templates: OpenAI (API key) and OpenAI OAuth (ChatGPT plan). */',
              '/** Built-in provider templates available through `clodex providers add`. */',
          )
          marker = "  {\n    id: 'openai-oauth',\n    name: 'OpenAI (ChatGPT)',\n    authType: 'oauth',\n    npm: '@ai-sdk/openai',\n    signupUrl: 'https://chatgpt.com',\n    modelSource: 'api-list',\n    supported: true,\n  },\n"
          addition = marker + "  {\n    id: 'opencode-go',\n    name: 'OpenCode Go',\n    authType: 'api',\n    npm: '@ai-sdk/openai-compatible',\n    defaultBaseUrl: 'https://opencode.ai/zen/go/v1',\n    modelsPath: 'models',\n    signupUrl: 'https://opencode.ai',\n    modelSource: 'api-list',\n    curatedModels: buildOpenCodeGoModels(),\n    curatedOnly: true,\n    supported: true,\n  },\n"
          text = replace_once(text, marker, addition, path + ' provider template')
          write(path, text)

          # Add the maintenance command without changing dependencies.
          path = 'package.json'
          package = json.loads(read(path))
          scripts = package['scripts']
          rebuilt = {}
          for key, value in scripts.items():
              rebuilt[key] = value
              if key == 'dev':
                  rebuilt['update:opencode-go-models'] = 'node scripts/update-opencode-go-models.mjs'
          package['scripts'] = rebuilt
          write(path, json.dumps(package, indent=2) + '\n')

          # User-facing setup and supported-provider documentation.
          path = 'README.md'
          text = read(path)
          section = '''### OpenCode Go provider

Clodex can also use the OpenCode Go catalog alongside native Claude and OpenAI/Codex-plan models:

```bash
clodex providers add   # choose OpenCode Go and paste your opencode.ai API key
clodex models          # favorite Kimi, DeepSeek, Qwen, MiniMax, MiMo, GLM, etc.
clodex patch
clodex claude
```

OpenCode Go models keep their provider-declared wire protocol per model: Anthropic Messages models are forwarded directly, while Chat Completions models use the OpenAI-compatible adapter. Responses-only entries are intentionally not exposed.

'''
          text = replace_once(
              text,
              '## Difference between Clodex and other solutions\n',
              section + '## Difference between Clodex and other solutions\n',
              path + ' setup section',
          )
          text = replace_once(
              text,
              'Providers supported: `openai` (API key, platform.openai.com) and `openai-oauth` (ChatGPT/Codex plan).',
              'Providers supported: `openai` (API key, platform.openai.com), `openai-oauth` (ChatGPT/Codex plan), and `opencode-go` (OpenCode Go API key).',
              path + ' provider list',
          )
          write(path, text)

          # Integration tests exercise sparse discovery, filtering, both protocols, and routing.
          write('tests/opencode-go-provider.test.ts', '''import { afterEach, describe, expect, it, vi } from 'vitest';
import { buildHttpProxyRoutes } from '../src/http-proxy/routes.js';
import { getTemplateById } from '../src/provider-templates.js';
import { fetchTemplateModels } from '../src/registry/fetch-template-models.js';
import { cachedModelToLocal } from '../src/registry/materialize.js';
import type { RegistryProvider } from '../src/registry/types.js';

const template = getTemplateById('opencode-go')!;

afterEach(() => {
  vi.unstubAllGlobals();
});

describe('OpenCode Go provider', () => {
  it('ships a curated mixed-protocol catalog without Responses models', () => {
    expect(template).toMatchObject({
      id: 'opencode-go',
      npm: '@ai-sdk/openai-compatible',
      defaultBaseUrl: 'https://opencode.ai/zen/go/v1',
      modelsPath: 'models',
      modelSource: 'api-list',
      curatedOnly: true,
      supported: true,
    });
    expect(template.curatedModels).toHaveLength(17);
    expect(template.curatedModels?.some(model => model.id === 'grok-4.5')).toBe(false);
    expect(template.curatedModels?.filter(model => model.modelFormat === 'anthropic')).toHaveLength(4);
    expect(template.curatedModels?.filter(model => model.modelFormat === 'openai')).toHaveLength(13);

    expect(template.curatedModels?.find(model => model.id === 'gpt-5.6-luna')).toMatchObject({
      npm: '@ai-sdk/openai-compatible',
      modelFormat: 'openai',
      apiUrl: 'https://opencode.ai/zen/go/v1',
      contextWindow: 1_050_000,
    });
    expect(template.curatedModels?.find(model => model.id === 'qwen3.8-max')).toMatchObject({
      npm: '@ai-sdk/anthropic',
      modelFormat: 'anthropic',
      apiUrl: 'https://opencode.ai/zen/go',
      contextWindow: 1_000_000,
    });
  });

  it('reconciles sparse live availability with curated model metadata', async () => {
    const rows = [
      ...(template.curatedModels ?? []).map(model => ({ id: model.id, name: model.id })),
      { id: 'grok-4.5', name: 'Grok 4.5' },
      { id: 'unreviewed-future-model', name: 'Future Model' },
    ];
    const fetchMock = vi.fn(async () => new Response(JSON.stringify({ data: rows }), {
      status: 200,
      headers: { 'Content-Type': 'application/json' },
    }));
    vi.stubGlobal('fetch', fetchMock);

    const result = await fetchTemplateModels(template, 'opencode-secret');

    expect(result.error).toBeUndefined();
    expect(result.models).toHaveLength(17);
    expect(result.models.some(model => model.id === 'grok-4.5')).toBe(false);
    expect(result.models.some(model => model.id === 'unreviewed-future-model')).toBe(false);
    expect(result.models.find(model => model.id === 'deepseek-v4-pro')).toMatchObject({
      contextWindow: 1_000_000,
      cost: { input: 0.435, output: 0.87, cache_read: 0.003625 },
      reasoningEffortMap: { high: 'high', max: 'max' },
      compat: {
        supportsStore: false,
        requiresReasoningContentOnAssistantMessages: true,
        thinkingFormat: 'deepseek',
      },
    });

    const [url, init] = fetchMock.mock.calls[0] as unknown as [string, RequestInit];
    expect(url).toBe('https://opencode.ai/zen/go/v1/models');
    expect(new Headers(init.headers).get('authorization')).toBe('Bearer opencode-secret');
  });

  it('builds selective-proxy routes for both Anthropic and completions models', async () => {
    const rows = (template.curatedModels ?? []).map(model => ({ id: model.id, name: model.id }));
    vi.stubGlobal('fetch', vi.fn(async () => new Response(JSON.stringify({ data: rows }), {
      status: 200,
      headers: { 'Content-Type': 'application/json' },
    })));
    const fetched = await fetchTemplateModels(template, 'opencode-secret');
    const provider: RegistryProvider = {
      id: 'opencode-go',
      templateId: 'opencode-go',
      name: 'OpenCode Go',
      enabled: true,
      authRef: 'keyring:provider:opencode-go',
      authType: 'api',
      api: { npm: template.npm, url: fetched.baseUrl },
      modelsCache: { fetchedAt: new Date(0).toISOString(), models: fetched.models },
      addedAt: new Date(0).toISOString(),
    };
    const localModels = fetched.models
      .map(model => cachedModelToLocal(model, provider))
      .filter(model => model !== null);
    const localProvider = {
      id: 'opencode-go',
      name: 'OpenCode Go',
      apiKey: 'opencode-secret',
      authType: 'api' as const,
      models: localModels,
    };

    const result = buildHttpProxyRoutes(localProvider ? [localProvider] : [], [
      { providerId: 'opencode-go', modelId: 'qwen3.8-max' },
      { providerId: 'opencode-go', modelId: 'gpt-5.6-luna' },
    ]);

    expect(result.unsupported).toEqual([]);
    expect(result.unavailable).toEqual([]);
    expect(result.routes).toHaveLength(2);
    expect(result.routes[0]).toMatchObject({
      realModelId: 'qwen3.8-max',
      modelFormat: 'anthropic',
      upstreamUrl: 'https://opencode.ai/zen/go',
      npm: '@ai-sdk/anthropic',
    });
    expect(result.routes[1]).toMatchObject({
      realModelId: 'gpt-5.6-luna',
      modelFormat: 'openai',
      npm: '@ai-sdk/openai-compatible',
      baseURL: 'https://opencode.ai/zen/go/v1',
