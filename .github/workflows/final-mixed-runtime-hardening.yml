name: Harden curated provider refresh

on:
  push:
    branches:
      - agent/mixed-provider-runtime

permissions:
  contents: write
  pull-requests: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - name: Add array discovery and scoped pricing locks
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          # Curated pricing authority is explicit model metadata, not a global cost heuristic.
          path = Path('src/registry/types.ts')
          text = path.read_text()
          if 'pricingLocked?: boolean;' not in text:
              text = replace_once(
                  text,
                  "  cost?: { input: number; output: number; cache_read?: number; cache_write?: number };\n",
                  "  cost?: { input: number; output: number; cache_read?: number; cache_write?: number };\n  /** Keep a curated provider price authoritative during global pricing enrichment. */\n  pricingLocked?: boolean;\n",
                  str(path),
              )
          path.write_text(text)

          path = Path('src/provider-templates.ts')
          text = path.read_text()
          if 'pricingLocked?: boolean;' not in text:
              text = replace_once(
                  text,
                  "  cost?: { input: number; output: number; cache_read?: number; cache_write?: number };\n",
                  "  cost?: { input: number; output: number; cache_read?: number; cache_write?: number };\n  pricingLocked?: boolean;\n",
                  str(path),
              )
          path.write_text(text)

          path = Path('src/registry/fetch-template-models.ts')
          text = path.read_text()
          text = text.replace(
              "function parseModelList(body: OpenAiModelListResponse, npm: string): CachedModel[] {\n  const rows = body.data ?? body.models ?? [];\n",
              "function parseModelList(\n  body: OpenAiModelListResponse | ProviderModelListRow[],\n  npm: string,\n): CachedModel[] {\n  const rows = Array.isArray(body) ? body : (body.data ?? body.models ?? []);\n",
          )
          text = text.replace(
              "    cost: model.cost,\n    modelFormat: model.modelFormat ?? modelFormatForNpm(npm),\n",
              "    cost: model.cost,\n    pricingLocked: model.pricingLocked ?? model.cost !== undefined,\n    modelFormat: model.modelFormat ?? modelFormatForNpm(npm),\n",
          )
          text = text.replace(
              "    let json: OpenAiModelListResponse = {};\n",
              "    let json: OpenAiModelListResponse | ProviderModelListRow[] = {};\n",
          )
          if 'Array.isArray(body) ? body' not in text or 'pricingLocked:' not in text:
              raise RuntimeError('fetch-template-models hardening did not apply')
          path.write_text(text)

          path = Path('src/registry/pricing.ts')
          text = path.read_text()
          text = text.replace('    if (model.cost) return model;\n', '')
          if 'if (model.pricingLocked) return model;' not in text:
              marker = 'return models.map(model => {\n'
              if marker not in text:
                  raise RuntimeError('pricing enrichment map not found')
              text = text.replace(marker, marker + '    if (model.pricingLocked) return model;\n', 1)
          path.write_text(text)

          # Remove the earlier call-site-only workaround; the model lock covers add and refresh.
          path = Path('src/registry/add-template.ts')
          text = path.read_text()
          scoped = '''  const pricedModels = enrichModelsWithPricing(
    catalogModels,
    buildPricingIndex(pricingCache),
    platform,
  ).map((model, index) => {
    const source = catalogModels[index];
    return source?.cost ? { ...model, cost: source.cost } : model;
  });
'''
          canonical = '''  const pricedModels = enrichModelsWithPricing(
    catalogModels,
    buildPricingIndex(pricingCache),
    platform,
  );
'''
          if scoped in text:
              text = text.replace(scoped, canonical, 1)
          elif canonical not in text:
              raise RuntimeError('add-template pricing call not found')
          path.write_text(text)

          path = Path('tests/curated-models.test.ts')
          text = path.read_text()
          text = text.replace(
              "import { describe, expect, it } from 'vitest';\n",
              "import { afterEach, describe, expect, it, vi } from 'vitest';\n",
          )
          text = text.replace(
              "import { applyCuratedModels } from '../src/registry/fetch-template-models.js';\n",
              "import { applyCuratedModels, fetchTemplateModels } from '../src/registry/fetch-template-models.js';\n",
          )
          if 'afterEach(() =>' not in text:
              anchor = "const discovered: CachedModel[] = [{\n"
              index = text.index(anchor)
              text = text[:index] + "afterEach(() => {\n  vi.unstubAllGlobals();\n});\n\n" + text[index:]
          text = text.replace(
              "      cost: { input: 1, output: 2 },\n      modalities: ['text', 'image'],\n",
              "      cost: { input: 1, output: 2 },\n      pricingLocked: true,\n      modalities: ['text', 'image'],\n",
              1,
          )
          if "accepts a bare model array" not in text:
              insertion = '''
  it('accepts a bare model array while applying curated-only filtering', async () => {
    vi.stubGlobal('fetch', vi.fn(async () => new Response(JSON.stringify([
      { id: 'qwen-mixed', name: 'Qwen Mixed' },
      { id: 'unknown-future-model', name: 'Unknown' },
    ]), {
      status: 200,
      headers: { 'Content-Type': 'application/json' },
    })));

    const result = await fetchTemplateModels(template, 'secret');
    expect(result.error).toBeUndefined();
    expect(result.models.map(model => model.id)).toEqual(['qwen-mixed']);
    expect(result.models[0]?.pricingLocked).toBe(true);
  });
'''
              text = text.replace("\n  it('carries compatibility metadata", insertion + "\n  it('carries compatibility metadata", 1)
          path.write_text(text)
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Publish clean hardened infrastructure commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -f .github/workflows/export-source.yml
          rm -f .github/workflows/implement-mixed-runtime.yml
          rm -f .github/workflows/finalize-mixed-runtime.yml
          rm -f .github/workflows/rescue-mixed-runtime.yml
          rm -f .github/workflows/verify-mixed-runtime-v2.yml
          rm -f .github/workflows/final-mixed-runtime-hardening.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --soft origin/main
          git add -A
          git diff --cached --check
          git commit -m "feat: support curated mixed-protocol providers"
          git push --force origin HEAD:agent/mixed-provider-runtime
          gh pr edit agent/mixed-provider-runtime --repo "$GITHUB_REPOSITORY" --base main
